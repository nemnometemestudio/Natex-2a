<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" fill="none">
  <defs>
    <!-- Ribbon 1 Upper: Orange-Red to Magenta -->
    <linearGradient id="fullLogoR1Upper" x1="120" y1="48" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF3B14" />
      <stop offset="28%" stop-color="#FF5722" />
      <stop offset="65%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#A81594" />
    </linearGradient>

    <!-- Ribbon 1 Lower: Crimson to Bright Golden Amber -->
    <linearGradient id="fullLogoR1Lower" x1="256" y1="300" x2="424" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B7094C" />
      <stop offset="22%" stop-color="#D00000" />
      <stop offset="58%" stop-color="#FF4800" />
      <stop offset="82%" stop-color="#FF7900" />
      <stop offset="100%" stop-color="#FFAA00" />
    </linearGradient>

    <!-- Ribbon 2: White-Violet to Royal Purple to Electric Cyan -->
    <linearGradient id="fullLogoR2" x1="390" y1="48" x2="110" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="18%" stop-color="#7C3AED" />
      <stop offset="42%" stop-color="#5B21B6" />
      <stop offset="62%" stop-color="#3B18A5" />
      <stop offset="82%" stop-color="#0284C7" />
      <stop offset="95%" stop-color="#00A8FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Translucent Diamond Overlap -->
    <linearGradient id="fullLogoCenterDiamond" x1="204" y1="256" x2="308" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C026D3" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#D946EF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#9333EA" stop-opacity="0.95" />
    </linearGradient>

    <!-- Top-Right Specular White Gloss Sheen -->
    <linearGradient id="fullLogoTopGloss" x1="320" y1="48" x2="424" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#E9D5FF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </linearGradient>

    <!-- Soft Depth Shadow -->
    <linearGradient id="fullLogoShadow" x1="256" y1="349" x2="280" y2="385" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B0764" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#3B0764" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Official 3D Ribbon Symbol on Left (Scaled 0.52x) -->
  <g transform="translate(32, 28) scale(0.52)">
    <!-- Layer 1: Ribbon 1 Upper Arm -->
    <path
      d="M 135.68 48 L 192 48 L 256 163 L 204 256 L 111.22 89.64 A 28 28 0 0 1 135.68 48 Z"
      fill="url(#fullLogoR1Upper)"
    />

    <!-- Layer 2: Ribbon 1 Lower Arm -->
    <path
      d="M 256 349 L 308 256 L 400.78 422.36 A 28 28 0 0 1 376.32 464 L 320 464 Z"
      fill="url(#fullLogoR1Lower)"
    />

    <!-- Layer 3: Ribbon 2 (Full Band) -->
    <path
      d="M 320 48 L 376.32 48 A 28 28 0 0 1 400.78 89.64 L 192 464 L 135.68 464 A 28 28 0 0 1 111.22 422.36 Z"
      fill="url(#fullLogoR2)"
    />

    <!-- Layer 4: Translucent Glowing Diamond Overlap -->
    <polygon
      points="256,163 308,256 256,349 204,256"
      fill="url(#fullLogoCenterDiamond)"
      style="mix-blend-mode: screen;"
    />

    <!-- Layer 5: Soft Depth Drop-Shadow on Ribbon 1 under Ribbon 2 -->
    <polygon
      points="256,349 308,256 322,282 270,375"
      fill="url(#fullLogoShadow)"
    />

    <!-- Layer 6: Specular White Gloss Sheen on Upper-Right Ribbon -->
    <path
      d="M 320 48 L 376.32 48 A 28 28 0 0 1 400.78 89.64 L 370 78 L 320 48 Z"
      fill="url(#fullLogoTopGloss)"
    />
  </g>

  <!-- Typography Wordmark: Dark Version (for Light Backgrounds) -->
  <g transform="translate(340, 52)">
    <!-- Letters NAT -->
    <text
      x="0"
      y="114"
      font-family="system-ui, -apple-system, sans-serif"
      font-size="124"
      font-weight="900"
      letter-spacing="5"
      fill="#0F172A"
    >NAT</text>

    <!-- Custom E with Purple Geometric Diagonal Accent -->
    <g transform="translate(362, 10)">
      <!-- E vertical spine -->
      <rect x="0" y="8" width="22" height="98" fill="#0F172A" />
      <!-- E top arm -->
      <rect x="22" y="8" width="46" height="22" fill="#0F172A" />
      <!-- E middle arm -->
      <rect x="22" y="47" width="40" height="20" fill="#0F172A" />
      <!-- E bottom arm with baseline connection -->
      <rect x="22" y="84" width="18" height="22" fill="#0F172A" />
      <!-- Custom Purple Geometric Diagonal Accent on Lower-Right of E -->
      <polygon points="40,106 72,106 72,78" fill="#6200EA" />
    </g>

    <!-- Letter X -->
    <text
      x="456"
      y="114"
      font-family="system-ui, -apple-system, sans-serif"
      font-size="124"
      font-weight="900"
      letter-spacing="5"
      fill="#0F172A"
    >X</text>

    <!-- Subtitle: CONFECÇÕES -->
    <text
      x="4"
      y="164"
      font-family="system-ui, -apple-system, sans-serif"
      font-size="28"
      font-weight="800"
      letter-spacing="12"
      fill="#475569"
    >CONFECÇÕES</text>

    <!-- Secondary Tagline -->
    <text
      x="4"
      y="198"
      font-family="system-ui, -apple-system, sans-serif"
      font-size="16"
      font-weight="700"
      letter-spacing="2"
      fill="#6200EA"
    >SOLUÇÕES TÊXTEIS EM ESCALA</text>
  </g>
</svg>
